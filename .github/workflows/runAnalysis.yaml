name: analysis

on: 
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setting up git
        run: |
            git config --global user.email "git@workflows.com"
            git config --global user.name "GitWorkflows"
      
      - name: Set up Python 3.11.2
        uses: actions/setup-python@v4
        with:
          python-version: 3.11.2

      - name: Setting up Python 
        working-directory: ./
        run: ./Scripts/pythonSetup.sh
        
      - name: Run Python Analysis
        working-directory: ./
        run: ./Scripts/runAnalysis.sh

      - name: Check for changes
        run: git status

      - name: Stage changed files
        run: git add analysis/*

      - name: Commit changed files
        run: git commit -m "Auto updating wordcount"

      - name: Fetch from master
        run: git fetch origin master

      - name: Push code to master
        run: git push origin HEAD:master